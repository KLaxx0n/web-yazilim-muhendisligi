<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Sırasız Listelerde Type parametresinin görevi CSS'e devredilmiştir -->
    <!-- CSS ile madde işaretini değiştirme yöntemini aşşağıdaki kodda kullandık -->
    <!-- Maddde işaretini değiştirmek için disc, square, circle kullanılır  -->
    <!-- Madde işaretini kaldırmak için none kullanılır -->
    <h1>Alışveriş Listesi</h1>
    <ul style="list-style-type: circle ;">
        <li>Yumurta</li>
        <li>Süt</li>
        <li>Tam Buğday Ekmeği</li>
        <li>Kahve Çekirdeği</li>
    </ul>
</body>

</html>
