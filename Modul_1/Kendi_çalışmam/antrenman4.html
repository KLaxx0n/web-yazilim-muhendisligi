<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bilgisayar notlarım</title>
    </head>
    <body>
        <h1>Bilgisayar Notlarım</h1>
        <p><abbr title="HyperText Markup Language">HTML</abbr> öğrenirken aldığım kısa notlar:</p>
        <ul>
            <li>Kaydetme: <kbd>CTRL</kbd>+ <kbd>S</kbd></li>
            <li>Kopyalama: <kbd>CTRL</kbd>+ <kbd>C</kbd> </li>
            <li>Büyük başlık etiketi: <code>&lt;h1&gt;</code></li>
        </ul>
        <!-- &lt; küçüktür işareti koyarken &gt; büyüktür işareti koyar ve siteye <h1> yazmanı sağlar. -->
    </body>
</html>
